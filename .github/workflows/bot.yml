name: Run RANDOM_GAMEER

on:
  push:
  workflow_dispatch:
    inputs:
      ip:
        description: 'Server IP (leave empty to use config.json)'
        required: false
        default: ''
  schedule:
    - cron: '0 */5 * * *'

concurrency:
  group: minecraft-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Start bot
        run: node index.js
        env:
          SERVER_IP: ${{ github.event.inputs.ip }}
